<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Zayd Ali Mohamed</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6ff;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --brand: #4f46e5;
        --border: rgba(15, 23, 42, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #060918;
          --card: #0f1530;
          --text: #e8ecff;
          --muted: #9aa6d1;
          --brand: #8b9bff;
          --border: rgba(255, 255, 255, 0.12);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        width: min(520px, 100%);
        text-align: center;
        padding: 40px 28px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .code {
        font-size: clamp(3.5rem, 18vw, 5.5rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(90deg, #65f0ff, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      a {
        padding: 11px 18px;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }
      a.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      a:hover,
      a:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>This page does not exist</h1>
      <p>The link may be old or mistyped. Head back to the portfolio and pick up from there.</p>
      <nav aria-label="Main pages">
        <a class="primary" href="/">Home</a>
        <a href="/projects">Projects</a>
        <a href="/experience">Experience</a>
        <a href="/skills">Skills</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>

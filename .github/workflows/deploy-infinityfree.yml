name: Deploy Portfolio to InfinityFree (zaydaly05.wuaze.com)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy-ftp:
    name: 🚀 Deploy to InfinityFree FTP (zaydaly05.wuaze.com)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Sync Assets & Media Files into Public Folder
        run: |
          mkdir -p public/Assets
          cp -r Assets/* public/assets/ 2>/dev/null || true
          cp -r Assets/* public/Assets/ 2>/dev/null || true

      - name: 📁 Deploy to InfinityFree FTP (htdocs)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftpupload.net' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /htdocs/
          dangerous-clean-slate: false

name: Autonomous Portfolio Screenshot & AI Enhancer

on:
  workflow_dispatch:
    inputs:
      targetUrl:
        description: 'URL of the project output/web interface'
        required: true
        default: 'https://zayd-portfolio.vercel.app'
      projectName:
        description: 'Name of the project'
        required: true
        default: 'project'
  repository_dispatch:
    types: [ publish_to_portfolio ]

jobs:
  screenshot-and-sync:
    name: 📸 Capture Screenshot & Update Portfolio
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Portfolio Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📸 Take Professional High-Res Screenshot
        env:
          TARGET_URL: ${{ github.event.inputs.targetUrl || github.event.client_payload.targetUrl }}
          PROJECT_NAME: ${{ github.event.inputs.projectName || github.event.client_payload.projectName }}
        run: |
          URL="${TARGET_URL:-https://zayd-portfolio.vercel.app}"
          NAME="${PROJECT_NAME:-Project}"
          echo "Capturing high-resolution screenshot for $NAME at $URL..."
          node scripts/take-screenshot.js "$URL" "$NAME"

      - name: 🧠 Run AI CV & Portfolio Enhancer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROJECT_NAME: ${{ github.event.inputs.projectName || github.event.client_payload.projectName }}
        run: |
          NAME="${PROJECT_NAME:-Project}"
          node scripts/ai-cv-updater.js "$NAME" "Automated CI Screenshot & Deployment" || true

      - name: 🚀 Commit & Push New Screenshots to Portfolio
        run: |
          git config --global user.name "Zayd AI Portfolio Bot"
          git config --global user.email "bot@zaydportfolio.local"
          git add public/assets/
          git commit -m "feat(assets): add automated project screenshot & AI updates [skip ci]" || echo "No new assets to commit"
          git push origin HEAD:main

      - name: 📱 Send WhatsApp Confirmation Alert
        if: always()
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          npx tsx send.ts || node scripts/test-notify.js || true

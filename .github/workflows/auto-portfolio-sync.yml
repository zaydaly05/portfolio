name: Auto Portfolio & Repos Sync Workflow

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Portfolio Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 Run GitHub Repos Auto-Sync Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE || '201017741741' }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: node scripts/auto-sync-portfolio.js

      - name: 📄 Auto-Compile LaTeX CV to PDF
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: latex-cv/Zayd_Ali_Mohamed_CV.tex

      - name: 📋 Copy Compiled CV PDF to Website Folders
        run: |
          PDF_SRC=""
          if [ -f "latex-cv/Zayd_Ali_Mohamed_CV.pdf" ]; then
            PDF_SRC="latex-cv/Zayd_Ali_Mohamed_CV.pdf"
          elif [ -f "Zayd_Ali_Mohamed_CV.pdf" ]; then
            PDF_SRC="Zayd_Ali_Mohamed_CV.pdf"
          fi

          if [ -n "$PDF_SRC" ]; then
            cp "$PDF_SRC" "Assets/cv.pdf"
            cp "$PDF_SRC" "Assets/Zayd Ali Mohamed CV.pdf"
            cp "$PDF_SRC" "public/assets/cv.pdf"
            cp "$PDF_SRC" "public/assets/Zayd Ali Mohamed CV.pdf"
            echo "✅ CV PDF updated in Assets and Public folders from $PDF_SRC!"
          else
            echo "⚠️ No compiled PDF found!"
          fi

      - name: 🚀 Commit & Push Updates if Repos or CV Changed
        run: |
          git config --global user.name "Zayd-AutoSync-Bot"
          git config --global user.email "bot@zaydportfolio.local"
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected! Committing and pushing..."
            git add .
            git commit -m "auto(sync): update portfolio data & compiled LaTeX CV from GitHub repositories [skip ci]"
            git push
          else
            echo "No repository changes detected. Portfolio is up to date."
          fi



      - name: 📱 Send Mobile WhatsApp Notification (CallMeBot API)
        if: always()
        env:
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE || '201017741741' }}
        run: |
          if [ -n "$CALLMEBOT_KEY" ]; then
            curl -s "https://api.callmebot.com/whatsapp.php?phone=${WHATSAPP_PHONE}&text=Zayd+Portfolio+Automation:+Workflow+executed+successfully!+Portfolio+is+up+to+date.&apikey=$CALLMEBOT_KEY" || true
          fi

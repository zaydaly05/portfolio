name: 🤖 Auto Portfolio & Repos Sync

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_cv_regenerate:
        description: 'Force CV PDF regeneration even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # ──────────────────────────────────────────────────
      # 1. SETUP
      # ──────────────────────────────────────────────────
      - name: 📥 Checkout Portfolio Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          echo "::group::npm ci output"
          npm ci
          echo "::endgroup::"
          echo "✅ Node packages installed"

      - name: 🎭 Install Playwright / Chromium
        run: |
          npx playwright install --with-deps chromium
          echo "✅ Chromium ready for PDF rendering"

      # ──────────────────────────────────────────────────
      # 2. PORTFOLIO DATA SYNC
      # ──────────────────────────────────────────────────
      - name: 🔍 Run GitHub Repos Auto-Sync Engine
        id: repo_sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          START=$(date +%s)
          node scripts/auto-sync-portfolio.js
          END=$(date +%s)
          ELAPSED=$(( END - START ))
          echo "sync_duration=${ELAPSED}s" >> "$GITHUB_OUTPUT"
          echo "⚡ Sync engine finished in ${ELAPSED}s"

      # ──────────────────────────────────────────────────
      # 3. CV PDF PIPELINE  (LaTeX → Playwright fallback)
      # ──────────────────────────────────────────────────
      - name: 📄 Compile LaTeX CV
        id: latex
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: latex-cv/Zayd_Ali_Mohamed_CV.tex

      - name: 📋 Build Final CV PDF  (LaTeX → Playwright fallback)
        id: cv
        run: |
          CANONICAL="public/assets/Zayd Ali Mohamed CV.pdf"

          # ── Try LaTeX output first (highest quality) ──
          if [ -f "Zayd_Ali_Mohamed_CV.pdf" ]; then
            cp "Zayd_Ali_Mohamed_CV.pdf" "$CANONICAL"
            SIZE=$(du -sh "$CANONICAL" | cut -f1)
            echo "cv_source=latex"      >> "$GITHUB_OUTPUT"
            echo "cv_size=${SIZE}"      >> "$GITHUB_OUTPUT"
            echo "✅ LaTeX PDF  →  $CANONICAL  (${SIZE})"

          # ── Playwright fallback ──
          else
            echo "⚠️  LaTeX PDF missing — falling back to Playwright renderer"
            node scripts/generate-pdf-cv.js || true

            if [ -f "$CANONICAL" ]; then
              SIZE=$(du -sh "$CANONICAL" | cut -f1)
              echo "cv_source=playwright" >> "$GITHUB_OUTPUT"
              echo "cv_size=${SIZE}"      >> "$GITHUB_OUTPUT"
              echo "✅ Playwright CV  →  $CANONICAL  (${SIZE})"
            else
              echo "cv_source=none"  >> "$GITHUB_OUTPUT"
              echo "cv_size=—"       >> "$GITHUB_OUTPUT"
              echo "❌ All CV renderers failed — CV unchanged this run"
            fi
          fi

      # ──────────────────────────────────────────────────
      # 4. COMMIT & PUSH
      # ──────────────────────────────────────────────────
      - name: 🚀 Commit & Push Updates
        id: git_push
        run: |
          git config --global user.name  "Zayd-AutoSync-Bot"
          git config --global user.email "bot@zaydportfolio.local"

          CHANGED=$(git status -s | wc -l | tr -d ' ')

          if [[ "$CHANGED" -gt 0 ]] || [[ "${{ inputs.force_cv_regenerate }}" == "true" ]]; then
            TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M UTC")
            CV_LABEL="cv:${{ steps.cv.outputs.cv_source }}(${{ steps.cv.outputs.cv_size }})"

            MSG=$(printf "auto(sync): portfolio refresh [${TIMESTAMP}]\n\n  📦 ${CHANGED} file(s) changed\n  🖨️  ${CV_LABEL}\n  ⚡ Repo sync: ${{ steps.repo_sync.outputs.sync_duration }}\n  🔖 Trigger: ${{ github.event_name }}\n\n  [skip ci]")

            git add .
            git commit -m "$MSG"
            git push
            echo "pushed=true"        >> "$GITHUB_OUTPUT"
            echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Portfolio is already up to date — nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "changed=0"    >> "$GITHUB_OUTPUT"
          fi


      # ──────────────────────────────────────────────────
      # 5. JOB SUMMARY  (visible on the Actions tab ✨)
      # ──────────────────────────────────────────────────
      - name: 📊 Write Job Summary
        if: always()
        run: |
          {
            echo "## 🤖 Portfolio Auto-Sync Report"
            echo ""
            echo "| | Field | Value |"
            echo "|--|-------|-------|"
            echo "| 🕐 | Run time | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| ⚡ | Trigger | \`${{ github.event_name }}\` |"
            echo "| 🔍 | Repo sync duration | ${{ steps.repo_sync.outputs.sync_duration }} |"
            echo "| 🖨️ | CV renderer | **${{ steps.cv.outputs.cv_source }}** |"
            echo "| 📐 | CV file size | ${{ steps.cv.outputs.cv_size }} |"
            echo "| 📦 | Files changed | ${{ steps.git_push.outputs.changed }} |"
            echo "| 🚀 | Pushed to GitHub | ${{ steps.git_push.outputs.pushed }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ──────────────────────────────────────────────────
      # 6. WHATSAPP NOTIFICATION
      # ──────────────────────────────────────────────────
      - name: 📱 Send WhatsApp Alert (Kapso)
        if: always()
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          npx tsx send.ts || node scripts/test-notify.js || true


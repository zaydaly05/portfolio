name: Auto Portfolio & Repos Sync Workflow

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Portfolio Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run GitHub Repos Auto-Sync Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: node scripts/auto-sync-portfolio.js

      - name: 📄 Auto-Compile LaTeX CV to PDF
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: latex-cv/Zayd_Ali_Mohamed_CV.tex

      - name: 📄 Generate Single Executive CV PDF
        run: |
          npx playwright install chromium || true
          node scripts/generate-pdf-cv.js || true


      - name: 🚀 Commit & Push Updates if Repos or CV Changed
        run: |
          git config --global user.name "Zayd-AutoSync-Bot"
          git config --global user.email "bot@zaydportfolio.local"
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected! Committing and pushing..."
            git add .
            git commit -m "auto(sync): update portfolio data & compiled LaTeX CV from GitHub repositories [skip ci]"
            git push
          else
            echo "No repository changes detected. Portfolio is up to date."
          fi

      - name: 📱 Send Mobile WhatsApp Alert (Kapso Cloud API)
        if: always()
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          npx tsx send.ts || node scripts/test-notify.js || true

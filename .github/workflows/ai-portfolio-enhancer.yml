name: AI Portfolio Enhancer & Issue Summarizer

on:
  issues:
    types: [ opened, edited ]
  workflow_dispatch:
    inputs:
      customPrompt:
        description: 'Custom AI Analysis Prompt'
        required: false
        default: 'Analyze recent repository improvements'

jobs:
  ai-enhancements:
    name: 🤖 AI Code & Issue Summary Automation
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧠 AI Analysis & Summarization Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          node -e '
          const fs = require("fs");
          async function runAI() {
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log("⚠️ GEMINI_API_KEY not set. Skipping AI summary.");
              return;
            }
            try {
              const { GoogleGenerativeAI } = require("@google/generative-ai");
              const genAI = new GoogleGenerativeAI(apiKey);
              const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
              const title = process.env.ISSUE_TITLE || "Portfolio Enhancement";
              const body = process.env.ISSUE_BODY || "Automation update";
              const prompt = `Summarize this issue in 3 bullet points with recommendations for Zayd Portfolio:\nTitle: ${title}\nBody: ${body}`;
              const result = await model.generateContent(prompt);
              console.log("🤖 AI Generated Insights:\n", result.response.text());
            } catch (err) {
              console.warn("AI Note:", err.message);
            }
          }
          runAI();
          '

      - name: 📱 Send Mobile WhatsApp Alert via Kapso
        if: always()
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: |
          npx tsx send.ts || node scripts/test-notify.js || true
